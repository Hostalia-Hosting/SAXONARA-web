name: 🚀 Deploy SAXONARA.com via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Syncing Files
    runs-on: ubuntu-latest

    concurrency: 
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 📂 FTP Upload Main Web
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ./saxonara.com/
        # --- CONFIGURACIÓ PER A HOSTINGS AGRESSIUS ---
        state-name: .ftp-deploy-sync-state.json
        protocol: ftp
        port: 21
        timeout: 900000 # Augmentem a 15 minuts
        # BLOQUEGEM les carpetes que Publii genera i que pesen massa
        # Si realment no les fas servir, això salvarà la connexió
        exclude: |
          .git*
          .github/**
          saxonara-blog/**
          node_modules/**
          **/tags/**
          **/authors/**
          **/page/**
          saxonara-files/tags/**