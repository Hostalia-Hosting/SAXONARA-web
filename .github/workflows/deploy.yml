name: 🚀 Deploy SAXONARA.com via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Syncing Files
    runs-on: ubuntu-latest

    concurrency: 
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 📂 FTP Upload Main Web
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ./saxonara.com/
        # --- CONFIGURACIÓ DE RESISTÈNCIA ---
        state-name: .ftp-deploy-sync-state.json # Evita comparar-ho tot cada vegada
        protocol: ftp
        port: 21
        timeout: 600000 # 10 minuts de marge per a connexions lentes
        # Forçat de seguretat:
        dangerous-clean-slate: false
        exclude: |
          .git*
          .github/**
          node_modules/**