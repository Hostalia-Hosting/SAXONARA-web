<!-- GOOGLE RICH CARDS (sript d'automatització) -->
<script>
    (function() {
    var metaDesc = document.querySelector('meta[name="description"]');
    var schemaElement = document.getElementById('schema-saxonara');
    
    if (schemaElement) {
        var schemaData = JSON.parse(schemaElement.innerText);
        
        // 1. URL DINÀMICA: Perquè Google sàpiga exactament en quina subpàgina és
        schemaData.url = window.location.href;
        
        // 2. DESCRIPCIÓ DINÀMICA (Agafada de la meta-description de cada idioma)
        schemaData.description = metaDesc ? metaDesc.getAttribute('content') : "SAXONARA - Saxofonista professional";
        
        // 3. NOM DINÀMIC (Opcional): Pots fer que el nom del "MusicGroup" 
        // inclogui el títol de la pàgina (ex: SAXONARA - Bodas en Andorra)
        schemaData.alternateName = document.title;

        schemaElement.innerText = JSON.stringify(schemaData);
    }
    })();
</script>

<!-- WHATSAPP LINK GENERATOR -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Busquem TOTS els enllaços que continguin el teu WhatsApp
    var waLinks = document.querySelectorAll('a[href*="wa.me/34625171701"]');

    if (waLinks.length > 0) {
        var path = window.location.pathname;
        var message = "";

        // Definim el missatge segons l'idioma (Text pur)
        if (path.includes('/en/')) {
            message = "Hi Arnald! I would like to get information about SAXONARA for an event:\n* Date:\n* Location:\n* Event type:";
        } else if (path.includes('/cat/')) {
            message = "Hola Arnald! M'agradaria rebre informacio de SAXONARA per a un esdeveniment:\n* Data:\n* Lloc:\n* Tipus d'esdeveniment:";
        } else if (path.includes('/fr/')) {
            message = "Bonjour Arnald! Je voudrais des informations sur SAXONARA pour un evenement:\n* Date:\n* Lieu:\n* Type d'evenement:";
        } else {
            // Missatge per defecte (Castellà / Home)
            message = "Hola Arnald! Me gustaria recibir informacion de SAXONARA para un evento:\n* Fecha:\n* Lugar:\n* Tipo de evento:";
        }

        var finalUrl = "https://wa.me/34625171701?text=" + encodeURIComponent(message);

        // Apliquem la URL a tots els enllaços de WhatsApp trobats
        waLinks.forEach(function(link) {
            link.href = finalUrl;
        });
    }
});
</script>
